services:
  - type: web
    name: jobflow-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true

  - type: worker
    name: jobflow-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString

  - type: web
    name: jobflow-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: jobflow-api
          property: host
          format: https://{host}

databases:
  - name: jobflow-db
    databaseName: jobplatform
    user: postgres
    plan: free
