services:
  - type: web
    name: jobflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.api
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobflow-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

databases:
  - name: jobflow-db
    databaseName: jobplatform
    plan: free
